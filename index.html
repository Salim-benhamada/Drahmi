<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>دراهمي</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7fb;font-family:system-ui,Tahoma,sans-serif}main{max-width:650px;margin:auto;padding:20px 15px 70px}h1{margin:12px 0 4px}p{color:#aebbd0}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:24px 0}button{cursor:pointer;border:0;border-radius:12px;padding:12px 10px;font-size:15px;font-weight:700;background:#26344b;color:white}nav button.active,.primary{background:#19b887;color:#061c16}.panel{background:#172237;border:1px solid #30415a;border-radius:18px;padding:18px;margin:14px 0}.amount{font-size:34px;font-weight:800;color:#50e2b4;direction:ltr;text-align:right}label{display:block;margin:14px 0 6px;color:#d4dfed}input{width:100%;background:#0c1627;border:1px solid #3d5069;color:#fff;padding:13px;border-radius:10px;font-size:17px}form button{margin-top:15px;width:100%}.entry{border-bottom:1px solid #30415a;padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.entry:last-child{border:0}.sub{font-size:12px;color:#9fb0c8;margin-top:4px}.actions{display:flex;gap:6px}.actions button{font-size:12px;padding:8px;background:#33445d}.danger{color:#ffb4b4!important}.muted{color:#aebbd0;font-size:13px}.hidden{display:none}.toolbar{display:flex;gap:8px;margin-top:18px}.toolbar button{flex:1;font-size:13px}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#234c40;padding:10px 18px;border-radius:12px;display:none}small{color:#9aacc5}</style><style>#authScreen{max-width:480px;margin:35px auto;padding:22px;background:#172237;border-radius:18px;border:1px solid #30415a}#authScreen input{margin:8px 0 12px}#authScreen button{width:100%;margin:5px 0}#authError{color:#ffb4b4}#syncStatus{font-size:12px;color:#aebbd0}#logout{background:#33445d;font-size:12px;padding:8px}#appArea.hidden{display:none}</style></head><body><section id="authScreen"><h2>🔐 دخول دراهمي</h2><p>استعمل نفس الإيميل وكلمة السر في زوج تليفونات.</p><label>الإيميل</label><input type="email" id="email" autocomplete="email"><label>كلمة السر</label><input type="password" id="password" autocomplete="current-password"><button class="primary" id="login">دخول</button><button id="signup">إنشاء حساب جديد</button><p id="authError"></p></section><div id="appArea" class="hidden"><main><button id="logout">خروج</button><span id="syncStatus">جاري الاتصال...</span><h1>💰 دراهمي</h1><p>وفّر دراهمك وتبّع التسلاف بسهولة</p><nav><button data-tab="a" class="active">2000da</button><button data-tab="b">oumb3ad tban</button><button data-tab="c">tslaf</button><button data-tab="d">المصاريف</button></nav><section class="panel"><small id="sumLabel">مجموع 2000da</small><div id="total" class="amount">0 دج</div><div id="count" class="muted"></div></section><section class="panel"><h3 id="formTitle">زيد دراهم</h3><form id="form"><div id="nameWrap" class="hidden"><label for="person" id="personLabel">اسم الشخص</label><input id="person" placeholder="مثلاً: أحمد"></div><label for="amount">المبلغ (دج)</label><input id="amount" type="number" min="0.01" step="any" required placeholder="مثلاً: 2000"><label for="date">التاريخ</label><input id="date" type="date" required><button class="primary" type="submit" id="submit">+ إضافة</button><button type="button" id="cancel" class="hidden">إلغاء التعديل</button></form></section><section class="panel"><h3 id="listTitle">سجل العمليات</h3><div id="entries"></div></section><div class="toolbar"><button id="export">⬇️ حفظ نسخة احتياطية</button><button id="import">⬆️ استرجاع نسخة</button><input type="file" id="file" accept="application/json" hidden></div><p class="muted">البيانات تتزامن عبر Firebase عند الاتصال بالإنترنت. دير نسخة احتياطية بانتظام.</p></main></div><div id="toast"></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,onSnapshot,doc,setDoc,deleteDoc,writeBatch} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyA_Mj8J68n1-T0umlPExwLOVMWJRDeeo_4',authDomain:'drahmi-1cccb.firebaseapp.com',projectId:'drahmi-1cccb',storageBucket:'drahmi-1cccb.firebasestorage.app',messagingSenderId:'863477425531',appId:'1:863477425531:web:2eec7cc3b0c7c9b1b3c9de',measurementId:'G-3W3MVPR7BR'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let data={a:[],b:[],c:[],d:[]},tab='a',editing=null,uid=null,unsubscribe=null,ready=false;
const names={a:'2000da',b:'oumb3ad tban',c:'tslaf',d:'المصاريف'},fmt=n=>new Intl.NumberFormat('fr-DZ',{maximumFractionDigits:2}).format(n)+' دج';
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function reset(){editing=null;$('form').reset();$('date').value=today();$('cancel').classList.add('hidden');$('submit').textContent='+ إضافة'}
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('sumLabel').textContent='مجموع '+names[tab];$('total').textContent=fmt(data[tab].reduce((s,e)=>s+Number(e.amount||0),0));$('count').textContent=data[tab].length+' تسجيلات';$('nameWrap').classList.toggle('hidden',tab!=='c'&&tab!=='d');$('person').required=tab==='c'||tab==='d';$('personLabel').textContent=tab==='d'?'واش صرفت؟':'اسم الشخص';$('person').placeholder=tab==='d'?'مثلاً: قهوة، ماكلة، نقل':'مثلاً: أحمد';$('formTitle').textContent=editing?'تعديل التسجيل':tab==='c'?'زيد شخص أو دين':tab==='d'?'سجّل مصروف':'زيد دراهم';$('listTitle').textContent=tab==='c'?'قائمة الديون':tab==='d'?'سجل المصاريف':'سجل الإضافات';const box=$('entries');box.replaceChildren();if(!data[tab].length){box.append(el('p','muted','مازال ما كاين حتى تسجيل.'));return}data[tab].slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{let row=el('div','entry'),details=el('div'),right=el('div'),title=el('div','',(tab==='c'||tab==='d')?e.person:fmt(e.amount));title.style.fontWeight='700';details.append(title,el('div','sub',e.date+((tab==='c'||tab==='d')?' · '+fmt(e.amount):'')));let actions=el('div','actions'),edit=el('button','','تعديل'),del=el('button','danger','حذف');edit.onclick=()=>{editing=e.id;$('person').value=e.person||'';$('amount').value=e.amount;$('date').value=e.date;$('cancel').classList.remove('hidden');$('submit').textContent='حفظ التعديل';$('formTitle').textContent='تعديل التسجيل';window.scrollTo({top:0,behavior:'smooth'})};del.onclick=async()=>{if(confirm('تحب تحذف هذا التسجيل؟')){try{await deleteDoc(doc(db,'users',uid,'entries',e.id));reset();notify('تم الحذف')}catch(err){alert('فشل الحذف: '+err.message)}}};actions.append(edit,del);right.append(actions);row.append(details,right);box.append(row)})}
function entries(){return collection(db,'users',uid,'entries')}
async function authenticate(register){$('authError').textContent='';try{let email=$('email').value.trim(),password=$('password').value;if(register)await createUserWithEmailAndPassword(auth,email,password);else await signInWithEmailAndPassword(auth,email,password)}catch(e){$('authError').textContent='ما قدرناش ندخلو: '+e.code+' — تأكد من الإيميل وكلمة السر وتفعيل Email/Password في Firebase'}}
$('login').onclick=()=>authenticate(false);$('signup').onclick=()=>authenticate(true);$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}uid=user?.uid||null;ready=false;$('authScreen').classList.toggle('hidden',!!user);$('appArea').classList.toggle('hidden',!user);if(!user){data={a:[],b:[],c:[],d:[]};return}$('syncStatus').textContent='جاري تحميل البيانات...';unsubscribe=onSnapshot(entries(),snap=>{data={a:[],b:[],c:[],d:[]};snap.forEach(d=>{let v=d.data();if(data[v.tab])data[v.tab].push({id:d.id,...v})});ready=true;$('syncStatus').textContent='✓ متزامن';render()},err=>{$('syncStatus').textContent='⚠ خطأ في المزامنة';alert('تأكد من قواعد Firestore: '+err.message)})});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;reset();render()});$('cancel').onclick=()=>{reset();render()};
$('form').onsubmit=async e=>{e.preventDefault();if(!uid||!ready){notify('استنى حتى تتصل قاعدة البيانات');return}let amount=Number($('amount').value),person=$('person').value.trim(),date=$('date').value;if(!Number.isFinite(amount)||amount<0||!date||((tab==='c'||tab==='d')&&!person)){notify('تأكد من المعلومات');return}let id=editing||crypto.randomUUID();$('submit').disabled=true;try{await setDoc(doc(db,'users',uid,'entries',id),{tab,amount,person,date});reset();notify('تسجّل وتزامن بنجاح')}catch(err){alert('فشل الحفظ: '+err.message)}finally{$('submit').disabled=false}};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='drahmi-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!['a','b','c'].every(k=>Array.isArray(d[k])))throw Error();if(!Array.isArray(d.d))d.d=[];if(!ready)throw Error('انتظر المزامنة');if(confirm('استرجاع النسخة يضيف تسجيلاتها للبيانات الحالية. موافق؟')){let all=['a','b','c','d'].flatMap(tab=>d[tab].map(v=>({tab,...v})));for(let i=0;i<all.length;i+=400){let batch=writeBatch(db);all.slice(i,i+400).forEach(v=>{let id=v.id||crypto.randomUUID();batch.set(doc(db,'users',uid,'entries',id),{tab:v.tab,amount:Number(v.amount)||0,person:String(v.person||''),date:v.date||today()})});await batch.commit()}notify('تم الاسترجاع')}}catch(err){alert('تعذّر الاسترجاع: '+err.message)}e.target.value=''};
reset();render();
</script></body></html>
