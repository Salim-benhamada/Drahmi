<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>دراهمي</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7fb;font-family:system-ui,Tahoma,sans-serif}main{max-width:650px;margin:auto;padding:20px 15px 70px}h1{margin:12px 0 4px}p{color:#aebbd0}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:24px 0}button{cursor:pointer;border:0;border-radius:12px;padding:12px 10px;font-size:15px;font-weight:700;background:#26344b;color:white}nav button.active,.primary{background:#19b887;color:#061c16}.panel{background:#172237;border:1px solid #30415a;border-radius:18px;padding:18px;margin:14px 0}.amount{font-size:34px;font-weight:800;color:#50e2b4;direction:ltr;text-align:right}label{display:block;margin:14px 0 6px;color:#d4dfed}input{width:100%;background:#0c1627;border:1px solid #3d5069;color:#fff;padding:13px;border-radius:10px;font-size:17px}form button{margin-top:15px;width:100%}.entry{border-bottom:1px solid #30415a;padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}.entry:last-child{border:0}.sub{font-size:12px;color:#9fb0c8;margin-top:4px}.actions{display:flex;gap:6px}.actions button{font-size:12px;padding:8px;background:#33445d}.danger{color:#ffb4b4!important}.muted{color:#aebbd0;font-size:13px}.hidden{display:none}.toolbar{display:flex;gap:8px;margin-top:18px}.toolbar button{flex:1;font-size:13px}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#234c40;padding:10px 18px;border-radius:12px;display:none}small{color:#9aacc5}</style></head><body><main><h1>💰 دراهمي</h1><p>وفّر دراهمك وتبّع التسلاف بسهولة</p><nav><button data-tab="a" class="active">2000da</button><button data-tab="b">oumb3ad tban</button><button data-tab="c">tslaf</button><button data-tab="d">المصاريف</button></nav><section class="panel"><small id="sumLabel">مجموع 2000da</small><div id="total" class="amount">0 دج</div><div id="count" class="muted"></div></section><section class="panel"><h3 id="formTitle">زيد دراهم</h3><form id="form"><div id="nameWrap" class="hidden"><label for="person" id="personLabel">اسم الشخص</label><input id="person" placeholder="مثلاً: أحمد"></div><label for="amount">المبلغ (دج)</label><input id="amount" type="number" min="0.01" step="any" required placeholder="مثلاً: 2000"><label for="date">التاريخ</label><input id="date" type="date" required><button class="primary" type="submit" id="submit">+ إضافة</button><button type="button" id="cancel" class="hidden">إلغاء التعديل</button></form></section><section class="panel"><h3 id="listTitle">سجل العمليات</h3><div id="entries"></div></section><div class="toolbar"><button id="export">⬇️ حفظ نسخة احتياطية</button><button id="import">⬆️ استرجاع نسخة</button><input type="file" id="file" accept="application/json" hidden></div><p class="muted">البيانات محفوظة على هذا المتصفح فقط. دير نسخة احتياطية من حين لآخر باش ما تضيعش إذا تمسحت بيانات المتصفح.</p></main><div id="toast"></div><script>
const KEY='drahmi_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{a:[],b:[],c:[],d:[]}}catch{data={a:[],b:[],c:[],d:[]}};for(const k of ['a','b','c','d'])if(!Array.isArray(data[k]))data[k]=[];let tab='a',editing=null;const $=id=>document.getElementById(id),names={a:'2000da',b:'oumb3ad tban',c:'tslaf',d:'المصاريف'},fmt=n=>new Intl.NumberFormat('fr-DZ',{maximumFractionDigits:2}).format(n)+' دج';function save(){localStorage.setItem(KEY,JSON.stringify(data))}function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function notify(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}function reset(){editing=null;$('form').reset();$('date').value=today();$('cancel').classList.add('hidden');$('submit').textContent='+ إضافة'}function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('sumLabel').textContent='مجموع '+names[tab];$('total').textContent=fmt(data[tab].reduce((s,e)=>s+Number(e.amount||0),0));$('count').textContent=data[tab].length+' تسجيلات';$('nameWrap').classList.toggle('hidden',tab!=='c'&&tab!=='d');$('person').required=tab==='c'||tab==='d';$('personLabel').textContent=tab==='d'?'واش صرفت؟':'اسم الشخص';$('person').placeholder=tab==='d'?'مثلاً: قهوة، ماكلة، نقل':'مثلاً: أحمد';$('formTitle').textContent=editing?'تعديل التسجيل':tab==='c'?'زيد شخص أو دين':tab==='d'?'سجّل مصروف':'زيد دراهم';$('listTitle').textContent=tab==='c'?'قائمة الديون':tab==='d'?'سجل المصاريف':'سجل الإضافات';const box=$('entries');box.replaceChildren();if(!data[tab].length){box.append(el('p','muted','مازال ما كاين حتى تسجيل.'));return}data[tab].slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(e=>{let row=el('div','entry'),details=el('div'),right=el('div'),title=el('div','',(tab==='c'||tab==='d')?e.person:fmt(e.amount));title.style.fontWeight='700';details.append(title,el('div','sub',e.date+((tab==='c'||tab==='d')?' · '+fmt(e.amount):'')));let actions=el('div','actions'),edit=el('button','','تعديل'),del=el('button','danger','حذف');edit.onclick=()=>{editing=e.id;$('person').value=e.person||'';$('amount').value=e.amount;$('date').value=e.date;$('cancel').classList.remove('hidden');$('submit').textContent='حفظ التعديل';$('formTitle').textContent='تعديل التسجيل';window.scrollTo({top:0,behavior:'smooth'})};del.onclick=()=>{if(confirm('تحب تحذف هذا التسجيل؟')){data[tab]=data[tab].filter(x=>x.id!==e.id);save();reset();render()}};actions.append(edit,del);right.append(actions);row.append(details,right);box.append(row)})}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;reset();render()});$('cancel').onclick=()=>{reset();render()};$('form').onsubmit=e=>{e.preventDefault();let amount=Number($('amount').value),person=$('person').value.trim(),date=$('date').value;if(!Number.isFinite(amount)||amount<0||!date||((tab==='c'||tab==='d')&&!person)){notify('تأكد من المعلومات');return}if(editing){let item=data[tab].find(x=>x.id===editing);if(item)Object.assign(item,{amount,person,date})}else data[tab].push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),amount,person,date});save();reset();render();notify('تسجّل بنجاح')};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='drahmi-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!['a','b','c'].every(k=>Array.isArray(d[k])))throw Error();if(!Array.isArray(d.d))d.d=[];if(confirm('استرجاع النسخة يعوض التسجيلات الحالية. موافق؟')){data=d;save();reset();render();notify('تم الاسترجاع')}}catch{alert('الملف غير صالح')}e.target.value=''};reset();render();
</script></body></html>
